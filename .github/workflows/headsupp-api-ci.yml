name: Heads Up API CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      run_deployed_smokes:
        description: Run deployed full smoke matrix
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  local-quality:
    name: Local Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/headsupp-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/headsupp-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check

      - name: Run load smoke
        run: npm run load:smoke

  deployed-smokes:
    name: Deployed Full Smoke Matrix
    needs: local-quality
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_deployed_smokes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/headsupp-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HEADSUPP_SMOKE_SLACK_WEBHOOK_URL: ${{ secrets.HEADSUPP_SMOKE_SLACK_WEBHOOK_URL }}
      HEADSUPP_BOOTSTRAP_TOKEN: ${{ secrets.HEADSUPP_BOOTSTRAP_TOKEN }}
      HEADSUPP_OPERATOR_TOKEN: ${{ secrets.HEADSUPP_OPERATOR_TOKEN }}
      HEADSUPP_SMOKE_DISPATCH_SLACK: "true"
      HEADSUPP_SMOKE_SERVICE_API_KEY: ${{ secrets.HEADSUPP_SMOKE_SERVICE_API_KEY }}
      HEADSUPP_SMOKE_EMAIL_DESTINATION: ${{ secrets.HEADSUPP_SMOKE_EMAIL_DESTINATION }}
      HEADSUPP_EMAIL_AUTH_SECRET: ${{ secrets.HEADSUPP_EMAIL_AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/headsupp-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: node scripts/verify-release-env.mjs --slack-required

      - name: Verify deployed D1 schema
        run: npm run release:verify-schema

      - name: Generic Slack smoke
        run: npm run smoke:generic-slack

      - name: Alert decisions smoke
        run: npm run smoke:alert-decisions

      - name: Foretic smoke
        run: npm run smoke:foretic

      - name: Scheduled watches smoke
        run: npm run smoke:scheduled

      - name: Delivery retry smoke
        run: npm run smoke:delivery-retry

      - name: Tenant isolation smoke
        run: npm run smoke:tenant-isolation

      - name: Quiet summary smoke
        run: npm run smoke:quiet-summary

      - name: Watch action controls smoke
        run: npm run smoke:action-controls

      - name: Channel contracts smoke
        run: npm run smoke:channel-contracts

      - name: Dimensioned aggregate-forward smoke
        run: npm run smoke:aggregate-forward-dimensions

      - name: Advanced watches smoke
        run: npm run smoke:advanced-watches

      - name: Trend up/down smoke
        run: npm run smoke:trend-up-down

      - name: Event occurrence smoke
        run: npm run smoke:event-occurrence

      - name: Valueless event smoke
        run: npm run smoke:valueless-event

      - name: Verify bootstrap token matches deployed Worker
        if: ${{ env.HEADSUPP_BOOTSTRAP_TOKEN != '' }}
        run: node scripts/verify-bootstrap-auth.mjs

      - name: Operator observability smoke
        if: ${{ env.HEADSUPP_BOOTSTRAP_TOKEN != '' && env.HEADSUPP_OPERATOR_TOKEN != '' }}
        run: npm run smoke:operator-observability

      - name: Operator observability smoke skipped
        if: ${{ env.HEADSUPP_BOOTSTRAP_TOKEN == '' || env.HEADSUPP_OPERATOR_TOKEN == '' }}
        run: |
          echo "Skipping operator observability smoke because HEADSUPP_BOOTSTRAP_TOKEN or HEADSUPP_OPERATOR_TOKEN is not configured."

      - name: Email subscriber smoke
        if: ${{ env.HEADSUPP_SMOKE_EMAIL_DESTINATION != '' }}
        run: npm run smoke:email-subscriber

      - name: Email subscriber smoke skipped
        if: ${{ env.HEADSUPP_SMOKE_EMAIL_DESTINATION == '' }}
        run: |
          echo "Skipping email subscriber smoke because HEADSUPP_SMOKE_EMAIL_DESTINATION is not configured."

      - name: Subscriber lifecycle smoke
        run: npm run smoke:subscriber-lifecycle

      - name: Release soak
        run: npm run soak:release
